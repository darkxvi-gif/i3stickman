<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stickman film</title>
<style>
  html,body{margin:0;height:100%;background:#07070b;color:#8b8894;font:12px/1.4 system-ui,sans-serif}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
  canvas{display:block;max-width:100%;max-height:calc(100vh - 70px);background:#000;border-radius:8px;box-shadow:0 20px 60px #000}
  #ui{display:flex;align-items:center;gap:12px}
  button{background:#15151d;color:#e9e4da;border:1px solid #2a2a36;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  button:hover{border-color:#ffd47e;color:#ffd47e}
  input[type=range]{width:220px;accent-color:#ffd47e}
  #rec.on{background:#e0302a;border-color:#e0302a;color:#fff}
  #time{font-family:ui-monospace,monospace;font-size:11px;min-width:86px}
  #panel{width:min(1100px,96vw);margin-top:4px}
  #panel summary{cursor:pointer;color:#8b8894;font-size:11px;letter-spacing:.08em;outline:none}
  #panel textarea{width:100%;height:200px;background:#0b0b12;color:#cfd3e6;border:1px solid #2a2a36;
    border-radius:8px;padding:10px;font:12px/1.55 ui-monospace,monospace;margin-top:8px;resize:vertical}
  #panel .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  #err{color:#ff6f61;font-size:11px;white-space:pre-wrap;font-family:ui-monospace,monospace}
  #partinfo{color:#8b8894;font-size:11px;font-family:ui-monospace,monospace}
  #panel button.alt{border-color:#3a3a48}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="ui">
    <button id="play">❚❚</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <span id="time">00:00</span>
    <button id="rec">● Record</button>
  </div>
  <details id="panel">
    <summary>STORY CODE — paste a part, then Build or Add as part</summary>
    <textarea id="src" spellcheck="false" placeholder="Paste STORY = {...} or PART = {...} here…"></textarea>
    <div class="row">
      <button id="build">Build film</button>
      <button id="add" class="alt">Add as part</button>
      <button id="copyState" class="alt">Copy state</button>
      <span id="partinfo">1 part · 6 shots · 26s</span>
      <span id="err"></span>
    </div>
  </details>
</div>
<script>
/* ==========================================================================
   STICKMAN FILM — a compact, self-contained engine.
   Edit only the STORY block and the shot list at the bottom.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 30;

/* ---------- palette: one key light, deep shadows, one rim ---------- */
const MOODS = {
  night:  { sky: ['#0b1028', '#1d2550', '#3a3570'], key: '#c9d4ff', rim: '#a9b8ff', wall: '#262a46', floor: '#1b1e33', dark: '#0f1122', practical: '#ffb860', fog: '#3a4270' },
  dusk:   { sky: ['#3d3360', '#8a5a86', '#e8956b', '#f7cf98'], key: '#ffc68a', rim: '#ffc68a', wall: '#4a3646', floor: '#3d2c38', dark: '#231a27', practical: '#ffd59a', fog: '#c08a8a' },
  golden: { sky: ['#6b5a8e', '#e89a6a', '#f9d49c'], key: '#ffcf8f', rim: '#ffc68a', wall: '#5a3a34', floor: '#45302a', dark: '#2a1814', practical: '#ffe7b0', fog: '#f0c49a' },
  warm:   { sky: ['#c98a74', '#f2b585', '#f7cf98'], key: '#ffd59a', rim: '#ffcf8f', wall: '#4f3a40', floor: '#3a2a2e', dark: '#21171c', practical: '#ffd28a', fog: '#a87a70' },
  cool:   { sky: ['#2a3560', '#5a6aa0'], key: '#cbd6ff', rim: '#b8c6ff', wall: '#2e3150', floor: '#22243a', dark: '#121426', practical: '#9fe0ff', fog: '#4a5080' },
  day:    { sky: ['#8fb0d8', '#cfdcea', '#efe3d2'], key: '#fff3dc', rim: '#fff1d6', wall: '#8d8496', floor: '#5f5866', dark: '#2f2a36', practical: '#ffe2a8', fog: '#dfe4f0' },
  dawn:   { sky: ['#1d2550', '#5a4a7a', '#e8a07a', '#ffd7a0'], key: '#ffd7a0', rim: '#ffcfc0', wall: '#4a3a4e', floor: '#2e2434', dark: '#1a1420', practical: '#ffd59a', fog: '#8a6a80' },
  storm:  { sky: ['#141a33', '#2a3358', '#3d4670'], key: '#dfe6ff', rim: '#cfd9ff', wall: '#2b3150', floor: '#1c2238', dark: '#0d1020', practical: '#bcd0ff', fog: '#4a5580' },
};
const INK = '#0e0b12', INKFAR = '#2b2333', FEATURE = '#f4efe6';
const GOLD = '#ffd47e', ACCENT = '#ff6f61', CREAM = '#fff1dc';

/* ---------- math / colour ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  inOut: (x) => ((x = clamp(x)) < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2),
  out: (x) => 1 - (1 - clamp(x)) ** 3,
  outBack: (x) => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; },
};
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hex = (c) => { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const css = (r, g, b, a = 1) => `rgba(${r | 0},${g | 0},${b | 0},${a})`;
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return css(lerp(A[0], B[0], k), lerp(A[1], B[1], k), lerp(A[2], B[2], k)); };
const shade = (c, k) => (k < 0 ? mix(c, '#000', -k) : mix(c, '#fff', k));
const alpha = (c, a) => { const x = hex(c); return css(x[0], x[1], x[2], a); };

/* ---------- drawing primitives ---------- */
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function seg(g, pts, w, c) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke(); }
function circle(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, Math.max(0, r), 0, Math.PI * 2); g.fill(); }
function grad(g, y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); return gr; }
function glow(g, x, y, r, c, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, alpha(c, a)); gr.addColorStop(0.4, alpha(c, a * 0.35)); gr.addColorStop(1, alpha(c, 0));
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}
function text(g, str, x, y, o = {}) {
  const { size = 48, weight = 900, color = '#fff', align = 'center', font = 'system-ui, sans-serif', spacing = 0, glow: gl = 0, alpha: a = 1 } = o;
  g.save(); g.globalAlpha *= a; g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle';
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
  if (gl) { g.shadowColor = color; g.shadowBlur = gl; }
  g.fillStyle = color; g.fillText(str, x, y); g.restore();
}

/* ---------- camera: every shot moves ---------- */
function cam(t, dur, o = {}) {
  const k = ease.inOut(prog(t, 0, dur));
  return { z: 1 + (o.push ?? 0.06) * k, x: (o.dx ?? 0) * k, y: (o.dy ?? 0) * k, r: (o.roll ?? 0) * k };
}
function layer(g, c, depth, fn) {
  g.save();
  g.translate(W / 2, H / 2); if (c.r) g.rotate(c.r * Math.min(1, depth));
  const z = 1 + ((c.z ?? 1) - 1) * depth; g.scale(z, z);
  g.translate(-W / 2 - (c.x || 0) * depth, -H / 2 - (c.y || 0) * depth);
  fn(g); g.restore();
}

/* ---------- the figure: 11 points, feet at y=0, faces +x ---------- */
const POSES = {
  stand: { head: [3, -208], sh: [0, -174], hip: [0, -100], eF: [9, -137], hF: [13, -101], eB: [-7, -136], hB: [-9, -100], kF: [6, -50], fF: [3, 0], kB: [-6, -50], fB: [-11, 0] },
  point: { head: [5, -208], sh: [1, -174], hip: [0, -100], eF: [34, -170], hF: [68, -172], eB: [-7, -136], hB: [-9, -100], kF: [6, -50], fF: [6, 0], kB: [-6, -50], fB: [-12, 0] },
  reach: { head: [8, -206], sh: [4, -172], hip: [0, -100], eF: [34, -186], hF: [62, -204], eB: [-6, -136], hB: [-10, -102], kF: [10, -50], fF: [12, 0], kB: [-6, -50], fB: [-18, 0] },
  sad: { head: [12, -192], sh: [6, -166], hip: [0, -100], eF: [10, -132], hF: [12, -98], eB: [-2, -132], hB: [-2, -98], kF: [6, -50], fF: [3, 0], kB: [-6, -50], fB: [-11, 0] },
  sit: { head: [4, -180], sh: [1, -146], hip: [0, -72], eF: [16, -110], hF: [38, -84], eB: [10, -110], hB: [30, -84], kF: [44, -74], fF: [46, 0], kB: [40, -72], fB: [38, 0] },
  jump: { head: [4, -232], sh: [1, -198], hip: [0, -124], eF: [24, -226], hF: [32, -266], eB: [-18, -226], hB: [-26, -266], kF: [16, -82], fF: [6, -48], kB: [-12, -84], fB: [-22, -50] },
};
const EXPR = {
  neutral: { eyes: 'dot', mouth: 'small' }, smile: { eyes: 'dot', mouth: 'smile' }, happy: { eyes: 'happy', mouth: 'grin' },
  surprised: { eyes: 'ring', mouth: 'o' }, shocked: { eyes: 'wide', mouth: 'o' }, determined: { eyes: 'dot', brows: 'angry', mouth: 'flat' },
  angry: { eyes: 'dot', brows: 'angry', mouth: 'flat' }, sad: { eyes: 'dot', brows: 'sad', mouth: 'frown' }, awe: { eyes: 'wide', mouth: 'o' },
};
function face(g, hx, hy, r, expr = 'neutral', look = [0, 0]) {
  const e = EXPR[expr] || EXPR.neutral, fx = hx + r * 0.3, fy = hy - r * 0.06;
  const eyes = [fx - r * 0.26, fx + r * 0.3], ey = fy - r * 0.06;
  g.save(); g.lineCap = 'round';
  eyes.forEach((x, i) => {
    if (e.eyes === 'happy') { g.strokeStyle = FEATURE; g.lineWidth = r * 0.09; g.beginPath(); g.arc(x, ey + r * 0.05, r * 0.13, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    else if (e.eyes === 'ring') { g.strokeStyle = FEATURE; g.lineWidth = r * 0.08; g.beginPath(); g.arc(x, ey, r * 0.18, 0, 7); g.stroke(); circle(g, x + look[0] * r * 0.05, ey + look[1] * r * 0.05, r * 0.07, FEATURE); }
    else if (e.eyes === 'wide') { circle(g, x, ey, r * 0.18, FEATURE); circle(g, x + look[0] * r * 0.07, ey + look[1] * r * 0.07, r * 0.08, INK); }
    else circle(g, x + look[0] * r * 0.04, ey + look[1] * r * 0.04, r * 0.12, FEATURE);
  });
  if (e.brows === 'angry') eyes.forEach((x, i) => seg(g, [[x - r * 0.14, ey - r * 0.3 + (i ? -r * 0.07 : r * 0.07)], [x + r * 0.14, ey - r * 0.3 + (i ? r * 0.07 : -r * 0.07)]], r * 0.07, FEATURE));
  if (e.brows === 'sad') eyes.forEach((x, i) => seg(g, [[x - r * 0.14, ey - r * 0.3 + (i ? r * 0.07 : -r * 0.07)], [x + r * 0.14, ey - r * 0.3 + (i ? -r * 0.07 : r * 0.07)]], r * 0.07, FEATURE));
  const mx = fx + r * 0.03, my = fy + r * 0.42;
  const mouth = e.mouth;
  if (mouth === 'grin') { g.fillStyle = FEATURE; g.beginPath(); g.moveTo(mx - r * 0.24, my - r * 0.05); g.quadraticCurveTo(mx, my + r * 0.34, mx + r * 0.24, my - r * 0.05); g.closePath(); g.fill(); }
  else if (mouth === 'smile') { g.strokeStyle = FEATURE; g.lineWidth = r * 0.08; g.beginPath(); g.arc(mx, my - r * 0.16, r * 0.22, 0.4, Math.PI - 0.4); g.stroke(); }
  else if (mouth === 'o') { g.fillStyle = FEATURE; g.beginPath(); g.ellipse(mx, my, r * 0.1, r * 0.14, 0, 0, 7); g.fill(); }
  else if (mouth === 'frown') { g.strokeStyle = FEATURE; g.lineWidth = r * 0.08; g.beginPath(); g.arc(mx, my + r * 0.18, r * 0.2, Math.PI + 0.5, Math.PI * 2 - 0.5); g.stroke(); }
  else if (mouth === 'flat') seg(g, [[mx - r * 0.15, my], [mx + r * 0.15, my]], r * 0.08, FEATURE);
  else { g.strokeStyle = FEATURE; g.lineWidth = r * 0.07; g.beginPath(); g.arc(mx, my - r * 0.12, r * 0.16, 0.5, Math.PI - 0.5); g.stroke(); }
  g.restore();
}
function figure(g, o) {
  const p = o.pose || POSES.stand, s = o.s || 1, f = o.facing || 1;
  const of = o.outfit || {}, top = of.color || (of.top === 'labcoat' ? '#ebe7f0' : '#3a6ea5');
  const draw = (dx, dy, ink, feat, sil) => {
    g.save(); g.translate(o.x + dx, o.y + dy); g.scale(f * s, s);
    seg(g, [p.sh, p.hip], 15, ink);
    seg(g, [p.hip, p.kB, p.fB, [p.fB[0] + 12, p.fB[1]]], 11.5, sil ? ink : INKFAR);
    seg(g, [p.sh, p.eB, p.hB], 10, sil ? ink : INKFAR);
    seg(g, [p.hip, p.kF, p.fF, [p.fF[0] + 13, p.fF[1]]], 12.5, ink);
    seg(g, [p.sh, p.eF, p.hF], 11, ink);
    if (of.top && !sil) {
      g.fillStyle = top;
      g.beginPath(); g.moveTo(p.sh[0] - 15, p.sh[1] - 1); g.quadraticCurveTo(p.sh[0], p.sh[1] - 12, p.sh[0] + 15, p.sh[1] - 1);
      g.lineTo(p.hip[0] + 15, p.hip[1] + 12); g.lineTo(p.hip[0] - 15, p.hip[1] + 12); g.closePath(); g.fill();
      seg(g, [p.sh, p.eF, p.hF], 16.5, top);
      seg(g, [p.sh, p.eB, [lerp(p.eB[0], p.hB[0], 0.7), lerp(p.eB[1], p.hB[1], 0.7)]], 16, shade(top, -0.3));
    }
    circle(g, p.head[0], p.head[1], 26, ink);
    if (of.head === 'cap' && !sil) {
      g.fillStyle = of.headColor || '#f2c21a';
      g.beginPath(); g.ellipse(p.head[0] - 1, p.head[1] - 8, 27, 21, 0, Math.PI, Math.PI * 2); g.fill();
      seg(g, [[p.head[0] + 6, p.head[1] - 9], [p.head[0] + 40, p.head[1] - 7]], 7, shade(of.headColor || '#f2c21a', -0.25));
    }
    if (!sil) face(g, p.head[0], p.head[1], 26, o.expr || 'neutral', o.look);
    g.restore();
  };
  const rim = o.rim || { color: '#ffc68a', dir: [0.6, -0.7], w: 4.5 };
  draw(rim.dir[0] * rim.w, rim.dir[1] * rim.w, rim.color, rim.color, true);
  draw(0, 0, INK, FEATURE, false);
}
function bigFace(g, cx, cy, r, o = {}) {
  const side = o.side ?? -1, rc = o.rimColor || '#ffc68a';
  g.save(); g.translate(cx, cy);
  g.fillStyle = o.color || INK;
  g.beginPath(); g.ellipse(0, r * 1.65, r * 1.25, r * 0.85, 0, Math.PI, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(0, 0, r + r * 0.055, 0, 7); g.arc(-side * r * 0.17, r * 0.12, r, 0, 7, true);
  g.fillStyle = rc; g.fill('evenodd');
  circle(g, 0, 0, r, INK);
  face(g, 0, 0, r, o.expr || 'neutral', o.look);
  g.restore();
}

/* ---------- atmosphere ---------- */
function dust(g, t, n = 40, c = '#ffe9d2') {
  const r = rng(3);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const x = r() * W, y = ((r() * H - t * 12 * (0.4 + r())) % H + H) % H;
    glow(g, x, y, 6 + r() * 8, c, 0.14);
  }
  g.restore();
}
function rain(g, t, n = 160, c = '#cfd9ff') {
  const r = rng(7); g.save(); g.strokeStyle = alpha(c, 0.28); g.lineWidth = 1.4; g.lineCap = 'round'; g.beginPath();
  for (let i = 0; i < n; i++) {
    const x = r() * W, y = ((r() * H + t * (900 + r() * 900)) % H);
    g.moveTo(x, y); g.lineTo(x + 7, y + 42);
  }
  g.stroke(); g.restore();
}

/* ---------- three sets ---------- */
function setStreet(g, t, c, mood = 'night') {
  const M = MOODS[mood], GY = H * 0.78;
  layer(g, c, 0.12, (g) => {
    g.fillStyle = grad(g, 0, H, M.sky); g.fillRect(-W, -H, W * 3, H * 3);
    const sx = W * 0.66, sy = GY - 90;
    glow(g, sx, sy, 260, M.key, 0.55); circle(g, sx, sy, 42, '#fff3dc');
    for (let i = 0; i < 26; i++) { const r = rng(i + 9); const bw = 50 + r() * 90, bh = 60 + r() * 220, bx = -W * 0.2 + i * 110; g.fillStyle = mix(M.sky[1], '#150d1c', 0.8); g.fillRect(bx, GY - bh, bw, bh); }
  });
  layer(g, c, 0.9, (g) => {
    g.fillStyle = grad(g, GY, GY + 340, [shade(M.floor, 0.05), shade(M.floor, -0.55)]); g.fillRect(-W, GY, W * 3, H);
    g.fillStyle = alpha(M.practical, 0.2); g.fillRect(-W, GY - 3, W * 3, 3);
    g.fillStyle = grad(g, GY, GY + 240, [alpha(M.practical, 0.18), alpha(M.practical, 0)]);
    g.fillRect(W * 0.18, GY, 80, 240); g.fillRect(W * 0.62, GY, 60, 210);
  });
  return { GY, M, CX: W / 2 };
}
function setRoom(g, t, c, mood = 'warm') {
  const M = MOODS[mood], GY = H * 0.8, CX = W / 2;
  layer(g, c, 0.5, (g) => {
    g.fillStyle = grad(g, 0, GY, [shade(M.wall, 0.10), shade(M.wall, -0.38)]); g.fillRect(-W, -H, W * 3, GY + H);
    const wx = CX - 330, wy = GY - 650, ww = 660, wh = 460;
    g.fillStyle = '#0a1024'; g.fillRect(wx, wy, ww, wh);
    g.fillStyle = grad(g, wy, wy + wh, ['#0a1024', '#1d2550', '#3a3570']); g.fillRect(wx, wy, ww, wh);
    for (let i = 0; i < 14; i++) { const r = rng(i + 4); g.fillStyle = mix('#0c122c', M.practical, 0.18); g.fillRect(wx + 20 + i * 46, wy + wh - 40 - r() * 110, 30, 20 + r() * 50); }
    g.strokeStyle = '#171020'; g.lineWidth = 12; g.strokeRect(wx, wy, ww, wh);
    g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.stroke();
    g.beginPath(); g.moveTo(wx, wy + wh / 2); g.lineTo(wx + ww, wy + wh / 2); g.stroke();
    glow(g, wx + ww / 2, wy + wh / 2, 420, '#6a80c8', 0.12);
    const lx = CX + 470, ly = GY - 540;
    seg(g, [[lx, ly - 30], [lx, ly - 8]], 4, '#0d0a12');
    g.fillStyle = '#171018'; g.beginPath(); g.moveTo(lx - 32, ly); g.lineTo(lx + 32, ly); g.lineTo(lx + 16, ly + 24); g.lineTo(lx - 16, ly + 24); g.closePath(); g.fill();
    circle(g, lx, ly + 20, 9, '#ffe6b8'); glow(g, lx, ly + 20, 180, M.practical, 0.4);
  });
  layer(g, c, 0.9, (g) => {
    g.fillStyle = grad(g, GY, GY + 360, [shade(M.floor, 0.03), shade(M.floor, -0.45)]); g.fillRect(-W, GY, W * 3, H);
    const bx = CX - 700;
    g.fillStyle = '#1c1422'; g.fillRect(bx, GY - 150, 440, 150);
    g.fillStyle = '#3a2c44'; rr(g, bx + 8, GY - 182, 424, 74, 14); g.fill();
    g.fillStyle = '#d8d0c4'; rr(g, bx + 22, GY - 214, 150, 48, 14); g.fill();
    const dx = CX + 300;
    g.fillStyle = '#2a1e2a'; g.fillRect(dx, GY - 300, 560, 22);
    g.fillStyle = '#0b0a10'; rr(g, dx + 150, GY - 396, 132, 92, 5); g.fill();
    g.fillStyle = '#7fd0d6'; g.fillRect(dx + 158, GY - 388, 116, 76); glow(g, dx + 216, GY - 350, 140, '#7fd0d6', 0.25);

}

/* ---------- post: bars, vignette, grain ---------- */
const BARS = { wide: 60, scope: 138, none: 0 };
const grainTiles = [];
function buildGrain() {
  for (let k = 0; k < 4; k++) {
    const c = document.createElement('canvas'); c.width = 480; c.height = 270;
    const x = c.getContext('2d'), id = x.createImageData(480, 270); let s = 99 + k * 777;
    for (let i = 0; i < id.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    x.putImageData(id, 0, 0); grainTiles.push(c);
  }
}
function post(g, frame, barsName) {
  const v = g.createRadialGradient(W / 2, H / 2, 260, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  if (grainTiles.length) { g.save(); g.globalAlpha = 0.055; g.globalCompositeOperation = 'overlay'; g.drawImage(grainTiles[frame % 4], 0, 0, W, H); g.restore(); }
  const b = BARS[barsName] ?? 0;
  if (b) { g.fillStyle = '#000'; g.fillRect(0, 0, W, b); g.fillRect(0, H - b, W, b); }
}

/* ==========================================================================
   STORY — replace everything from here to the end of the shot list.
   Each shot is { id, dur, bars, draw(g, t, info) }.
   ========================================================================== */
var STORY = {
  title: 'The Last Lightkeeper',
  shots: [
    /* 01 · establishing wide — a small figure against the last light */
    { id: 's1', dur: 5, bars: 'wide', draw(g, t, info) {
      const c = cam(t, info.dur, { push: 0.08, dx: -30 });
      const { GY, M } = setStreet(g, t, c, 'dusk');
      layer(g, c, 1, (g) => figure(g, { x: W * 0.64, y: GY, s: 1.15, facing: -1, pose: POSES.stand, expr: 'awe', outfit: { top: 'hoodie', color: '#d64a33' }, rim: { color: M.rim, dir: [0.7, -0.7], w: 5 } }));
      dust(g, t, 26, '#ffd9b0');
      title(g, t, ['THE LAST', 'LIGHTKEEPER'], info.dur, H * 0.36);
    } },
    /* 01b · a location built from a spec — house at golden hour */
    { id: 's1b', dur: 5, bars: 'wide', draw(g, t, info) {
      const c = cam(t, info.dur, { push: 0.07, dx: 24 });
      const { GY, M } = setSpec(g, t, c, {
        type: 'exterior', mood: 'golden', ground: 0.8, sunX: 0.78, sunY: 190,
        buildings: [{ house: true, x: 0.52, w: 560, h: 340, color: '#4a3340', chimney: true }],
        props: [{ t: 'tree', x: 0.12, s: 1.6 }, { t: 'tree', x: 0.9, s: 1.2 }, { t: 'lamp', x: 0.72, h: 300 }, { t: 'car', x: 0.86, s: 0.9, color: '#2a2030' }],
      });
      layer(g, c, 1, (g) => figure(g, { x: W * 0.3, y: GY, s: 1.2, facing: 1, pose: POSES.stand, expr: 'smile',
        outfit: { top: 'hoodie', color: '#d64a33' }, rim: { color: M.rim, dir: [0.7, -0.7], w: 5 } }));
      dust(g, t, 18, '#ffd9b0');
    } },
    /* 02 · two-shot — two figures, one key light, rim on both */
    { id: 's2', dur: 5, bars: 'wide', draw(g, t, info) {
      const c = cam(t, info.dur, { push: 0.05, dx: 20 });
      const { GY, M } = setRoom(g, t, c, 'warm');
      const s = 1.55;
      layer(g, c, 1, (g) => {
        figure(g, { x: W * 0.38, y: GY, s, facing: 1, pose: POSES.stand, expr: 'determined', outfit: { top: 'hoodie', color: '#d64a33' }, rim: { color: M.rim, dir: [0, -1], w: 4.5 } });
        figure(g, { x: W * 0.62, y: GY, s, facing: -1, pose: POSES.stand, expr: 'smile', outfit: { top: 'labcoat', head: 'none' }, rim: { color: M.rim, dir: [0, -1], w: 4.5 } });
      });
      dust(g, t, 40);
    } },
    /* 03 · giant face — the signature shot */
    { id: 's3', dur: 4, bars: 'scope', draw(g, t, info) {
      const c = { z: 1.6, x: -120, y: -160 };
      layer(g, c, 1, (g) => { g.fillStyle = '#120c14'; g.fillRect(-W, -H, W * 3, H * 3); });
      g.save(); g.filter = 'blur(18px)'; setRoom(g, t, { ...c, z: 1.9 }, 'cool'); g.restore();
      g.fillStyle = 'rgba(10,8,14,.42)'; g.fillRect(0, 0, W, H);
      bigFace(g, W / 2, H * 0.57, 310, { expr: t > 1.3 ? 'determined' : 'awe', rimColor: MOODS.cool.rim, side: -1, color: '#d64a33' });
      dust(g, t, 20);
    } },
    /* 04 · freeze-frame — the world stops */
    { id: 's4', dur: 4.5, bars: 'scope', draw(g, t, info) {
      const c = { z: 1 + 0.03 * t, r: -0.03 + 0.012 * t };
      g.save(); g.filter = 'blur(16px)'; setRoom(g, t, { z: 1.9, x: -100, y: -260 }, 'cool'); g.restore();
      g.fillStyle = 'rgba(10,12,24,.5)'; g.fillRect(0, 0, W, H);
      layer(g, c, 1, (g) => {
        const x = W / 2, y = H * 0.48;
        for (let i = 0; i < 26; i++) { const r = rng(i + 2)(); const px = x - 220 + r * 440, py = y - 200 + r * 400; glow(g, px, py, 10 + r * 14, '#d8e4ff', 0.35); }
        g.fillStyle = '#f2ece4'; rr(g, x - 70, y - 40, 140, 90, 8); g.fill();
        g.fillStyle = '#6a3a22'; g.fillRect(x - 64, y - 34, 128, 12);
        g.fillStyle = '#0e0b12'; g.fillRect(x - 80, y + 50, 160, 12);
      });
      g.save(); g.globalCompositeOperation = 'soft-light'; g.fillStyle = 'rgba(74,122,255,.4)'; g.fillRect(0, 0, W, H); g.restore();
      text(g, '100×', W - 90, 180, { size: 40, color: GOLD, align: 'right', glow: 18 });
    } },
    /* 05 · data card — the number the narrator says */
    { id: 's5', dur: 3.5, bars: 'none', draw(g, t, info) {
      const c = { z: 1.5, x: -40, y: -100 };
      g.save(); g.filter = 'blur(20px)'; setStreet(g, t, c, 'night'); g.restore();
      g.fillStyle = 'rgba(8,8,14,.62)'; g.fillRect(0, 0, W, H);
      data(g, '29', 'CAME BEFORE HIM', 'ALL OF THEM GONE');
    } },
    /* 06 · end card */
    { id: 's6', dur: 4, bars: 'none', draw(g, t, info) {
      g.fillStyle = grad(g, 0, H, ['#120d1a', '#241528', '#3d2226']); g.fillRect(0, 0, W, H);
      FXPool(g, W / 2, H * 1.02, W * 0.45, 240, '#ff9a5a', 0.3);
      const a = clamp(t / 0.7);
      text(g, 'What would YOU do with the last light?', W / 2, H * 0.3, { size: 56, color: CREAM, alpha: a, font: 'Georgia, serif', weight: 400 });
      ['hoodie', 'labcoat'].forEach((o, i) => figure(g, { x: W / 2 + (i ? 150 : -150), y: H - 60, s: 1.3, facing: 1, pose: POSES.stand, expr: 'smile', outfit: { top: o, color: o === 'hoodie' ? '#d64a33' : '#ebe7f0' }, rim: { color: '#ffb070', dir: [0, -1], w: 5 } }));
      text(g, 'LIKE & SUBSCRIBE', W / 2, H * 0.62, { size: 28, color: GOLD, spacing: 6, alpha: a });
    } },
  ],
};

/* ==========================================================================
   PLAYER — leave this alone.
   ========================================================================== */
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
let total = STORY.shots.reduce((a, s) => a + s.dur, 0);
var PART = null;
let t0 = 0, paused = false, at = 0, last = performance.now();

function shotAt(t) { let acc = 0; for (let i = 0; i < STORY.shots.length; i++) { if (t < acc + STORY.shots[i].dur) return [i, t - acc]; acc += STORY.shots[i].dur; } return [STORY.shots.length - 1, STORY.shots[STORY.shots.length - 1].dur]; }

function renderAt(t) {
  const [i, lt] = shotAt(t), s = STORY.shots[i];
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  try { s.draw(g, lt, { dur: s.dur, globalT: t }); } catch (e) { g.fillStyle = '#200'; g.fillRect(0, 0, W, H); text(g, 'SHOT ERROR ' + s.id, W / 2, H / 2, { size: 40, color: '#f66' }); console.error(e); }
  post(g, Math.floor(t * FPS), s.bars || 'wide');
  g.fillStyle = 'rgba(0,0,0,0)';
  document.getElementById('time').textContent = `00:${String(Math.floor(t)).padStart(2, '0')}`;
  document.getElementById('scrub').value = String((t / total) * 1000);
}
window.renderAt = renderAt;

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) { at += dt; if (at >= total) at = 0; renderAt(at); }
  requestAnimationFrame(tick);
}
buildGrain();
renderAt(0);
requestAnimationFrame(tick);

/* controls */
document.getElementById('play').onclick = (e) => { paused = !paused; e.target.textContent = paused ? '▶' : '❚❚'; };
document.getElementById('scrub').oninput = (e) => { at = (e.target.value / 1000) * total; renderAt(at); };

/* ---------- paste a STORY or PART block and rebuild ---------- */
function stripFences(s) { var F = String.fromCharCode(96, 96, 96); return s.trim().replace(new RegExp('^' + F + '(?:js|javascript)?', 'i'), '').replace(new RegExp(F + '$'), '').trim(); }
function parseBlock() {
  let code = stripFences(document.getElementById('src').value);
  if (!/^(STORY|PART)\s*=/.test(code)) code = 'PART = ' + code;
  const isPart = /^PART\s*=/.test(code);
  (0, eval)(code);
  const obj = isPart ? PART : STORY;
  if (!obj || !Array.isArray(obj.shots) || !obj.shots.length) throw new Error('No shots found - expected STORY = {...} or PART = {...}');
  obj.shots.forEach(function (s, i) {
    if (!s || typeof s.dur !== 'number' || typeof s.draw !== 'function') throw new Error('Shot ' + (i + 1) + ' needs a numeric dur and a draw(g,t,info) function');
  });
  return { obj: obj, isPart: isPart };
}
function info() {
  var n = STORY.shots.length, parts = STORY.parts || 1;
  document.getElementById('partinfo').textContent = parts + (parts === 1 ? ' part · ' : ' parts · ') + n + ' shots · ' + Math.round(total) + 's';
}
function apply(obj, append) {
  if (!append) { STORY = { title: obj.title || STORY.title, shots: obj.shots.slice(), parts: 1 }; }
  else {
    var have = {};
    STORY.shots.forEach(function (s) { have[s.id] = 1; });
    obj.shots.forEach(function (s) {
      var id = s.id || ('s' + (STORY.shots.length + 1));
      while (have[id]) id = id + 'b';
      have[id] = 1;
      STORY.shots.push(Object.assign({}, s, { id: id }));
    });
    STORY.parts = (STORY.parts || 1) + 1;
  }
  total = STORY.shots.reduce(function (a, s) { return a + s.dur; }, 0);
  at = 0; paused = false;
  document.getElementById('play').textContent = '❚❚';
  document.getElementById('err').textContent = '';
  info(); renderAt(0);
}
document.getElementById('build').onclick = function () {
  try { apply(parseBlock().obj, false); } catch (e) { document.getElementById('err').textContent = String(e.message || e); }
};
document.getElementById('add').onclick = function () {
  try { apply(parseBlock().obj, true); } catch (e) { document.getElementById('err').textContent = String(e.message || e); }
};
document.getElementById('copyState').onclick = function () {
  var ids = STORY.shots.map(function (s) { return s.id; }).join(', ');
  var nextId = 's' + (STORY.shots.length + 1);
  var state = 'FILM STATE - title: ' + STORY.title + ' | parts: ' + (STORY.parts || 1) +
    ' | shots: ' + ids + ' | total: ' + total.toFixed(1) + 's | next id: ' + nextId +
    '\nContinue the film with the next 3 shots only, same style rules, ids continuing from ' + nextId + '.';
  var box = document.getElementById('src');
  try { navigator.clipboard.writeText(state); } catch (e) { box.value = state; box.select(); }
  document.getElementById('partinfo').textContent = 'state copied';
  setTimeout(info, 1800);
};
info();


/* record the canvas to a .webm (no audio in this base) */
let rec = null, chunks = [];
document.getElementById('rec').onclick = async (e) => {
  if (rec) { rec.stop(); return; }
  const stream = canvas.captureStream(FPS);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  chunks = [];
  rec.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'film.webm'; a.click();
    rec = null; e.target.classList.remove('on'); e.target.textContent = '● Record';
  };
  rec.start(1000); at = 0; paused = false;
  e.target.classList.add('on'); e.target.textContent = '■ Stop';
};
</script>
</body>
